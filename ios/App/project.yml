name: AcornIOS
options:
  bundleIdPrefix: app.acorn
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    GCC_NO_COMMON_BLOCKS: YES

packages:
  AcornIOSPackage:
    path: ..

targets:
  AcornIOS:
    type: application
    platform: iOS
    sources:
      - path: AcornIOS
    info:
      path: AcornIOS/Info.plist
      properties:
        CFBundleDisplayName: Acorn
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Acorn uses the microphone to capture your voice when you tap the record button. Audio is transcribed and immediately discarded.
        NSSpeechRecognitionUsageDescription: Acorn uses on-device speech recognition to turn your spoken thoughts into text without uploading them.
        NSAppleEventsUsageDescription: Acorn uses App Intents so Siri and Shortcuts can stash text into your day without opening the app.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    entitlements:
      path: AcornIOS/AcornIOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.acorn.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AcornIOS/AcornIOS.entitlements
        # Simulator: skip codesigning entirely so anyone can build without
        # an Apple Developer account. CI uses this path.
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
        # Device: Xcode handles signing automatically. DEVELOPMENT_TEAM is
        # set per-developer through the Xcode UI (Signing & Capabilities
        # tab). It is intentionally NOT pinned here so this repo stays
        # team-agnostic. See ../README.md "Deploy to a real iPhone".
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
    dependencies:
      - package: AcornIOSPackage
        product: AcornApp
      - target: AcornWidget
        embed: true
      - target: AcornShare
        embed: true

  AcornShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AcornShare
    info:
      path: AcornShare/Info.plist
      properties:
        CFBundleDisplayName: Stash to Acorn
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: AcornShare/AcornShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.acorn.ios.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AcornShare/AcornShare.entitlements
        SKIP_INSTALL: YES
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
    dependencies:
      - package: AcornIOSPackage
        product: AcornCore

  AcornWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AcornWidget
    info:
      path: AcornWidget/Info.plist
      properties:
        CFBundleDisplayName: Acorn Today
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    entitlements:
      path: AcornWidget/AcornWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.acorn.ios.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AcornWidget/AcornWidget.entitlements
        SKIP_INSTALL: YES
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
    dependencies:
      - package: AcornIOSPackage
        product: AcornCore

schemes:
  AcornIOS:
    build:
      targets:
        AcornIOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
