name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: cargo fmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Bootstrap GRDB dependency
        # ios/Package.swift uses a local path for GRDB (workaround for slow
        # SwiftPM network resolution on dev machines). CI has no such cache,
        # so shallow-clone the pinned tag here.
        run: |
          mkdir -p ${{ runner.workspace }}/.deps-cache
          if [ ! -d "${{ runner.workspace }}/.deps-cache/GRDB.swift" ]; then
            git clone --depth 1 --branch v7.9.0 --single-branch \
              https://github.com/groue/GRDB.swift.git \
              ${{ runner.workspace }}/.deps-cache/GRDB.swift
          fi
          # Package.swift expects ../../.deps-cache/GRDB.swift relative to
          # ios/, i.e. <repo-parent>/.deps-cache/. Symlink it into place.
          mkdir -p ../.deps-cache
          ln -sfn ${{ runner.workspace }}/.deps-cache/GRDB.swift ../.deps-cache/GRDB.swift
      - name: swift build (AcornCore + AcornUI + AcornApp libraries)
        working-directory: ios
        run: swift build
      - name: swift test (AcornCoreTests)
        working-directory: ios
        run: swift test
      - name: Generate Xcode project for AcornIOS app target
        working-directory: ios/App
        run: xcodegen generate
      - name: xcodebuild for iPhone Simulator (iOS 26)
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project AcornIOS.xcodeproj \
            -scheme AcornIOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
          | xcpretty || exit ${PIPESTATUS[0]}
