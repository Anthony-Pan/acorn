name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. A clear repro is the fastest path to a fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem in one or two sentences.
      placeholder: I clicked Stash it and the app froze.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Acorn.
        2. Configure DeepSeek as the active provider.
        3. Paste this exact text…
        4. Hit Stash it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Acorn version
      placeholder: v0.1.0 (from About, or the release tag)
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant terminal output or attach screenshots. Redact API keys.
      render: shell
