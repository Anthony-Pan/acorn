<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acorn Overlay</title>
    <style>
      html,
      body {
        background: transparent;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      /* The whole canvas is click-through by default; only interactive nodes
         opt back in with pointer-events:auto, paired with the native
         set_overlay_interactive toggle so clicks fall through to the app
         behind the overlay. */
      #root {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
